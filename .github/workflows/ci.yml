name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # Re-runs the prod deploy (a re-run of an old push deploys that old commit).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The `main` ruleset (stacks/github.ts) requires this context.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.event.pull_request.number || github.sha }}-${{ github.event.action == 'labeled' && github.event.label.name != 'preview' && 'labels' || 'code' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint, typecheck and test
        run: bun run ci
      - name: Build (no Cloudflare credentials)
        run: bun run build

  preview:
    needs: check
    # Fork PRs never get deploy credentials; deploys skip until stacks/github.ts has run.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'preview') && (github.event.action != 'labeled' || github.event.label.name == 'preview') && vars.DEPLOYS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Deploy preview
        run: bunx alchemy deploy --stage "$STAGE" --yes --no-input
      - name: Smoke test
        run: bun scripts/ci/smoke.ts "$STAGE"
      - name: SEO audit
        run: bun scripts/ci/seo.ts "$STAGE"

  production:
    needs: check
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOYS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # id-token: the prod stack reads secret-santa-prod (Infisical env `prod`) as ci-prod over OIDC.
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
      INFISICAL_OIDC_AUDIENCE: ${{ vars.INFISICAL_OIDC_AUDIENCE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Deploy supersimplesecretsanta.com
        run: bunx alchemy deploy --stage prod --yes --no-input
      - name: Smoke test
        run: bun scripts/ci/smoke.ts prod
      - name: SEO audit
        run: bun scripts/ci/seo.ts prod
