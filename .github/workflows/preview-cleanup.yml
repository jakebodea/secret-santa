name: Preview cleanup

on:
  pull_request:
    types: [closed, unlabeled]

permissions:
  contents: read

jobs:
  destroy:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.action == 'closed' || github.event.label.name == 'preview') && vars.DEPLOYS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Teardown runs main's code, never the closed PR's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Destroy preview stage
        # Only ever a pr-<n> stage: the preview token has no zone permissions anyway.
        run: bunx alchemy destroy --stage "pr-${{ github.event.pull_request.number }}" --yes --no-input
