name: Setup
description: Bun (version from package.json) with a cached install.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
      id: bun-cache
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
    - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
      if: steps.bun-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}
